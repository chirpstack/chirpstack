name: Bug report
description: Create a bug report
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Please provide a clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Please provide the version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Please provide step-by-step instructions how to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Actual behaviour
      description: Please describe what currently happens.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Please describe what you expected to happen.
  - type: textarea
    id: additional
    attributes:
      label: Additional info
      description: Please add any additional info that could be helpful to debug this issue.
