# Logging.
[logging]

  # Log level.
  #
  # Options are: trace, debug, info, warn error.
  level = "info"


# PostgreSQL configuration.
[postgresql]

  # PostgreSQL DSN.
  #
  # Format example: postgres://<USERNAME>:<PASSWORD>@<HOSTNAME>/<DATABASE>?sslmode=<SSLMODE>.
  #
  # SSL mode options:
  #  * disable - no SSL
  #  * prefer - SSL if available, fall back to no SSL. Do not use if you are serious about security.
  #  * require - Always SSL with full verification. Behaves like verify-full in all other drivers.
  # https://github.com/jbg/tokio-postgres-rustls/issues/11
  dsn = "postgres://chirpstack:chirpstack@localhost/chirpstack?sslmode=disable"

  # for TLS
  ca_cert = ''
  tls_key = ''
  tls_cert = ''

  # Max open connections.
  #
  # This sets the max. number of open connections that are allowed in the
  # PostgreSQL connection pool.
  max_open_connections = 10

  # Min idle connections.
  #
  # This sets the min. number of idle connections in the PostgreSQL connection
  # pool (0 = equal to max_open_connections).
  min_idle_connections = 0

  # Connection recycling method.
  #
  # This controls how connections are validated when returned to the connection pool.
  # Options:
  #  * verified - Run a validation query (SELECT 1) when recycling connections (safer, slightly slower)
  #  * fast - Skip validation query when recycling connections (faster, but may return stale connections)
  #
  # The 'verified' method is recommended for production use to ensure connection health.
  # Use 'fast' when using an external connection pooler (PgBouncer, AWS RDS Proxy,
  # GCP Cloud SQL Connection Pooling) that already handles connection validation.
  connection_recycling_method = "verified"


# Redis configuration.
[redis]

  # Server address or addresses.
  #
  # Set multiple addresses when connecting to a cluster.
  servers = ["redis://localhost/"]

  # Redis Cluster.
  #
  # Set this to true when the provided URLs are pointing to a Redis Cluster
  # instance.
  cluster = false

  # for TLS
  ca_cert = ''
  tls_key = ''
  tls_cert = ''


# Network related configuration.
[network]

  # Network identifier (NetID, 3 bytes) encoded as HEX (e.g. 010203).
  net_id = "000000"

  # Enabled regions.
  #
  # Multiple regions can be enabled simultaneously. Each region must match
  # the 'name' parameter of the region configuration in '[[regions]]'.
  enabled_regions = [
    "as923",
    "as923_2",
    "as923_3",
    "as923_4",
    "au915_0",
    "cn470_10",
    "cn779",
    "eu433",
    "eu868",
    "in865",
    "ism2400",
    "kr920",
    "ru864",
    "us915_0",
    "us915_1",
  ]


# API interface configuration.
[api]

  # interface:port to bind the API interface to.
  bind = "0.0.0.0:8080"

  # Secret.
  #
  # This secret is used for generating login and API tokens, make sure this
  # is never exposed. Changing this secret will invalidate all login and API
  # tokens. The following command can be used to generate a random secret:
  #   openssl rand -base64 32
  secret = "you-must-replace-this"


[integration]
  enabled = ["mqtt"]

  [integration.mqtt]
    server = "tcp://localhost:1883/"
    json = true
